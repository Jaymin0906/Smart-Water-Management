{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block auth_content %}
<div class="auth-card">
  <div class="auth-brand">
    <div class="brand-badge-ring">
      <div class="brand-badge">💧</div>
    </div>
    <h2>AquaPulse</h2>
    <p>Intelligent Water Monitoring &amp; Automation Platform</p>
  </div>

  <div class="demo-credentials-box">
    <div class="demo-box-header">
      <span class="demo-tag">DEMO ENVIRONMENT</span>
      <button type="button" class="demo-autofill-btn" id="autofillDemoBtn">Auto-fill</button>
    </div>
    <div class="demo-creds-row">
      <div>Username: <strong>admin</strong></div>
      <div>Password: <strong>water123</strong></div>
    </div>
  </div>

  <form method="POST" action="{{ url_for('login') }}" id="loginForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label class="form-label" for="username">Operator Username</label>
      <div class="input-with-icon">
        <span class="input-icon">👤</span>
        <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autofocus autocomplete="username">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div class="input-with-icon">
        <span class="input-icon">🔒</span>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
      </div>
    </div>

    <button type="submit" class="btn btn-primary btn-auth">
      <span>Sign In to Console</span>
      <span class="btn-arrow">&rarr;</span>
    </button>
  </form>

  <div class="auth-footer-link">
    Need a new account? <a href="{{ url_for('signup') }}">Register here</a>
  </div>
</div>
{% endblock %}
